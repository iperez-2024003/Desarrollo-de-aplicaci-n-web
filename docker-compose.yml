services:
  postgres:
    image: postgres:16
    container_name: gestiontareas_postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-Gestion-Tareas}
      POSTGRES_USER: ${DB_USERNAME:-root}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-admin}
    ports:
      - "${DB_PORT:-5436}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mongodb:
    image: mongo:7
    container_name: gestiontareas_mongodb
    restart: always
    environment:
      MONGO_INITDB_DATABASE: gestion-tareas
    ports:
      - "${MONGO_PORT:-27018}:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  postgres_data:
  mongo_data:
